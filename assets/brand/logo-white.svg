<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Isotipo -->
  <g transform="translate(6, 8)">
    
  <!-- Calendar Hanger Loops -->
  <rect x="27" y="6" width="9" height="18" rx="4.5" fill="#ffffff" />
  <rect x="64" y="6" width="9" height="18" rx="4.5" fill="#ffffff" />

  <!-- Calendar Main Outer Shell -->
  <rect x="13" y="16" width="74" height="72" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />

  <!-- Header Bar Divider -->
  <line x1="16" y1="35" x2="84" y2="35" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Calendar Grid (Subtle, balanced) -->
  <line x1="37" y1="46" x2="37" y2="76" stroke="rgba(255, 255, 255, 0.65)" stroke-width="3" stroke-linecap="round" />
  <line x1="63" y1="46" x2="63" y2="76" stroke="rgba(255, 255, 255, 0.65)" stroke-width="3" stroke-linecap="round" />
  <line x1="23" y1="53" x2="77" y2="53" stroke="rgba(255, 255, 255, 0.65)" stroke-width="3" stroke-linecap="round" />
  <line x1="23" y1="67" x2="52" y2="67" stroke="rgba(255, 255, 255, 0.65)" stroke-width="3" stroke-linecap="round" />

  <!-- Speed Trails on Bottom-Left -->
  <path d="M5 74h10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <path d="M2 81h14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <path d="M6 88h10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Dynamic Swoosh Body (smooth curve) -->
  <path d="M11 86C26 86 48 82 66 67C76 58 82 49 85 41" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />

  <!-- Dynamic Arrowhead -->
  <path d="M72 38L93 34L87 55L82 45Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  </g>

  <!-- Text: Turnos -->
  <text x="106" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Turnos</text>

  <!-- Text: Ya -->
  <text x="246" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.3" fill="#ffffff">Ya</text>
</svg>